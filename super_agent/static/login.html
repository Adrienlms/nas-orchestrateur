<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Agent — Connexion</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f4f5f7; color: #1f2328; padding: 1rem;
  }
  main {
    width: 100%; max-width: 22rem; background: #fff; border-radius: 12px;
    padding: 2rem 1.5rem; box-shadow: 0 2px 12px rgba(0, 0, 0, .08);
  }
  h1 { margin: 0 0 1.5rem; font-size: 1.5rem; text-align: center; }
  label { display: block; font-size: .9rem; margin-bottom: .4rem; }
  input {
    width: 100%; padding: .7rem .8rem; font-size: 1rem; border: 1px solid #c8ccd1;
    border-radius: 8px;
  }
  input:focus { outline: 2px solid #2f6feb; outline-offset: 1px; border-color: #2f6feb; }
  .error { min-height: 1.3rem; margin: .5rem 0 1rem; color: #c62828; font-size: .9rem; }
  button {
    width: 100%; padding: .75rem; font-size: 1rem; border: 0; border-radius: 8px;
    background: #2f6feb; color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: progress; }
  @media (prefers-color-scheme: dark) {
    body { background: #0d1117; color: #e6edf3; }
    main { background: #161b22; box-shadow: none; }
    input { background: #0d1117; color: #e6edf3; border-color: #30363d; }
    .error { color: #ff7b72; }
  }
</style>
</head>
<body>
<main>
  <h1>Super Agent</h1>
  <form id="form">
    <label for="password">Mot de passe</label>
    <input id="password" type="password" name="password" autocomplete="current-password"
           autofocus required>
    <div id="error" class="error" role="alert"></div>
    <button id="submit" type="submit">Se connecter</button>
  </form>
</main>
<script>
  const form = document.getElementById("form");
  const input = document.getElementById("password");
  const button = document.getElementById("submit");
  const error = document.getElementById("error");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    button.disabled = true;
    error.textContent = "";
    try {
      const response = await fetch("/api/login", {
        method: "POST",
        headers: {"content-type": "application/json"},
        body: JSON.stringify({password: input.value}),
      });
      if (response.ok) {
        location.href = "/";
        return;
      }
      let message = "Connexion impossible";
      try { message = (await response.json()).error || message; } catch (e) { /* corps non JSON */ }
      error.textContent = message;
    } catch (e) {
      error.textContent = "Serveur injoignable";
    }
    input.value = "";
    input.focus();
    button.disabled = false;
  });
</script>
</body>
</html>
